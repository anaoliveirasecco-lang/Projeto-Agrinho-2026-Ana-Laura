<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgroSustentável: O Jogo do Agrinho Pro</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #4caf50;
            --accent: #ffb300;
            --dark: #1b5e20;
            --bg: #e8f5e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            color: var(--dark);
            margin-bottom: 15px;
        }

        #paineis-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .painel-box {
            background: white;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: bold;
            text-align: center;
            min-width: 100px;
        }

        .status-valor {
            font-size: 1.2rem;
            color: var(--primary);
            display: block;
            margin-top: 5px;
        }

        #alerta-evento {
            background-color: #ffe082;
            border: 2px solid #ffb300;
            color: #5d4037;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            max-width: 500px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        #controles {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 600px;
        }

        .btn-construcao {
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn-construcao:hover { transform: scale(1.05); }
        .btn-construcao:disabled { background-color: #bdbdbd !important; color: #757575; cursor: not-allowed; transform: none; }

        #btn-milho { background-color: #fff59d; color: #5d4037; }
        #btn-soja { background-color: #c5e1a5; color: #33691e; }
        #btn-bio { background-color: #80deea; color: #006064; }
        #btn-reserva { background-color: #a5d6a7; color: #1b5e20; }
        #btn-trator { background-color: #ef9a9a; color: #b71c1c; }

        #acoes-globais {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-global {
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        #btn-turno { background-color: #e65100; color: white; }
        #btn-expandir { background-color: #0288d1; color: white; }

        .selecionado { outline: 3px solid black; }

        #tabuleiro {
            display: grid;
            grid-template-columns: repeat(5, 80px);
            grid-template-rows: repeat(5, 80px);
            gap: 5px;
            background: #a1887f;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
        }

        .celula {
            background-color: #8d6e63;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: background 0.3s;
        }

        .bloqueado {
            background-color: #4e342e;
            cursor: not-allowed;
            color: #795548;
            font-size: 1rem;
        }

        .celula:not(.bloqueado):hover { filter: brightness(1.2); }
        .milho { background-color: #fff59d; }
        .soja { background-color: #c5e1a5; }
        .bio { background-color: #80deea; }
        .reserva { background-color: #a5d6a7; }
    </style>
</head>
<body>

    <header>
        <h1>AgroSustentável: Simulador de Gestão</h1>
        <p>Gerencie o espaço, mude suas culturas e expanda suas terras com equilíbrio!</p>
    </header>

    <section id="paineis-container">
        <div class="painel-box"><span>Era Atual</span><span id="txt-era" class="status-valor" style="color:#0d47a1;">🌾 Inicial</span></div>
        <div class="painel-box"><span>Caixa</span><span id="txt-moedas" class="status-valor">R$ 1000</span></div>
        <div class="painel-box"><span>Produção</span><span id="txt-producao" class="status-valor">0 sc</span></div>
        <div class="painel-box"><span>Sustentabilidade</span><span id="txt-sustentabilidade" class="status-valor">100%</span></div>
        <div class="painel-box"><span>Tamanho Mapa</span><span id="txt-tamanho" class="status-valor">3 x 3</span></div>
    </section>

    <div id="alerta-evento">⚠️ Evento: Nenhuma adversidade reportada.</div>

    <section id="controles">
        <button id="btn-milho" class="btn-construcao" onclick="selecionarConstrucao('milho')">🌽 Plantar Milho (-R$80)</button>
        <button id="btn-soja" class="btn-construcao" onclick="selecionarConstrucao('soja')" disabled>🌱 Plantar Soja (-R$150)</button>
        <button id="btn-bio" class="btn-construcao" onclick="selecionarConstrucao('bio')" disabled>🛸 Bioinsumos Agrotech (-R$300)</button>
        <button id="btn-reserva" class="btn-construcao" onclick="selecionarConstrucao('reserva')">🌳 Reserva Legal (-R$100)</button>
        <button id="btn-trator" class="btn-construcao" onclick="selecionarConstrucao('trator')">🚜 Trator / Limpar Solo (-R$30)</button>
    </section>

    <div id="acoes-globais">
        <button id="btn-turno" class="btn-global" onclick="passarTurno()">🗓️ AVANÇAR ANO & COLHER</button>
        <button id="btn-expandir" class="btn-global" onclick="expandirTerras()">🗺️ COMPRAR EXPANSÃO (-R$500)</button>
    </div>

    <main id="tabuleiro"></main>

    <script>
        let moedas = 1000;
        let producao = 0;
        let sustentabilidade = 100;
        let construcaoSelecionada = null;
        let eraAtual = 1; 
        let tamanhoMapa Ativo = 3; // Começa 3x3, expande até 5x5

        const dadosConstrucao = {
            milho: { custo: 80, prod: 25, sust: -10, icone: '🌽' },
            soja: { custo: 150, prod: 55, sust: -15, icone: '🌱' },
            bio: { custo: 300, prod: 90, sust: 10, icone: '🛸' },
            reserva: { custo: 100, prod: 0, sust: 20, icone: '🌳' },
            trator: { custo: 30, prod: 0, sust: 0, icone: '' }
        };

        const eventosAdversos = [
            { nome: "🐛 Ataque de Pragas!", impactoProd: -20, impactoSust: -5, msg: "Insetos atingiram a lavoura tradicional. Lavouras de tecnologia Bio sofreram menos impacto!" },
            { nome: "☀️ Seca Severa!", impactoProd: -30, impactoSust: 0, msg: "Falta d'água reduziu a colheita geral." },
            { nome: "🌱 Clima Ideal!", impactoProd: 20, impactoSust: 5, msg: "Condições perfeitas aumentaram o ganho da safra!" }
        ];

        // Matriz lógica do mapa 5x5 (guardará os estados de cada célula)
        let mapaDados = Array(25).fill('bloqueado');

        function inicializarMapa() {
            mapaDados = Array(25).fill('bloqueado');
            for (let x = 0; x < 5; x++) {
                for (let y = 0; y < 5; y++) {
                    if (x < tamanhoMapaAtivo && y < tamanhoMapaAtivo) {
                        mapaDados[x * 5 + y] = 'vazio';
                    }
                }
            }
        }

        function renderizarTabuleiro() {
            const tabuleiro = document.getElementById('tabuleiro');
            tabuleiro.innerHTML = '';
            
            for (let i = 0; i < 25; i++) {
                const celula = document.createElement('div');
                celula.classList.add('celula');
                
                if (mapaDados[i] === 'bloqueado') {
                    celula.classList.add('bloqueado');
                    celula.innerText = '🔒';
                } else if (mapaDados[i] === 'vazio') {
                    celula.innerText = '';
                } else {
                    celula.classList.add(mapaDados[i]);
                    celula.innerText = dadosConstrucao[mapaDados[i]].icone;
                }

                celula.addEventListener('click', () => interagirCelula(i));
                tabuleiro.appendChild(celula);
            }
        }

        function selecionarConstrucao(tipo) {
            construcaoSelecionada = tipo;
            document.querySelectorAll('.btn-construcao').forEach(btn => btn.classList.remove('selecionado'));
            document.getElementById(`btn-${tipo}`).classList.add('selecionado');
        }

        function interagirCelula(indice) {
            if (mapaDados[indice] === 'bloqueado') {
                alert("Este lote está trancado! Use o botão 'Comprar Expansão' para liberar mais terras.");
                return;
            }
            if (!construcaoSelecionada) {
                alert("Selecione uma ação no painel superior primeiro!");
                return;
            }

            const tipoAcao = construcaoSelecionada;
            const config = dadosConstrucao[tipoAcao];

            // Mecânica de Limpeza / Trator
            if (tipoAcao === 'trator') {
                if (mapaDados[indice] === 'vazio') return;
                if (moedas >= config.custo) {
                    moedas -= config.custo;
                    // Remove os impactos da estrutura antiga antes de limpar
                    const tipoAntigo = mapaDados[indice];
                    producao -= dadosConstrucao[tipoAntigo].prod;
                    
                    mapaDados[indice] = 'vazio';
                    renderizarTabuleiro();
                    atualizarInterface();
                } else {
                    alert("Sem dinheiro para operar o trator!");
                }
                return;
            }

            // Mecânica de Construção / Plantio
            if (mapaDados[indice] !== 'vazio') {
                alert("Lote ocupado! Use o Trator se quiser mudar a cultura deste espaço.");
                return;
            }

            if (moedas >= config.custo) {
                moedas -= config.custo;
                mapaDados[indice] = tipoAcao;
                producao += config.prod;
                sustentabilidade = Math.min(100, Math.max(0, sustentabilidade + config.sust));

                renderizarTabuleiro();
                atualizarInterface();
                verificarFimDeJogo();
            } else {
                alert("Recursos insuficientes!");
            }
        }

        function expandirTerras() {
            if (tamanhoMapaAtivo >= 5) {
                alert("Você já expandiu sua propriedade ao limite máximo permitido!");
                return;
            }
            if (moedas >= 500) {
                moedas -= 500;
                tamanhoMapaAtivo++;
                
                // Libera as novas células na matriz de dados
                for (let x = 0; x < 5; x++) {
                    for (let y = 0; y < 5; y++) {
                        if (x < tamanhoMapaAtivo && y < tamanhoMapaAtivo && mapaDados[x * 5 + y] === 'bloqueado') {
                            mapaDados[x * 5 + y] = 'vazio';
                        }
                    }
                }
                renderizarTabuleiro();
                atualizarInterface();
            } else {
                alert("Você precisa de R$ 500 para comprar novas terras!");
            }
        }

        function passarTurno() {
            if (producao === 0) {
                alert("Sua fazenda não está produzindo nada para colher!");
                return;
            }

            let modProd = 0;
            let modSust = 0;
            const caixaAlerta = document.getElementById('alerta-evento');

            if (Math.random() > 0.4) {
                const ev = eventosAdversos[Math.floor(Math.random() * eventosAdversos.length)];
                modProd = ev.impactoProd;
                modSust = ev.impactoSust;
                caixaAlerta.style.display = "block";
                caixaAlerta.innerText = `⚠️ ${ev.nome} - ${ev.msg}`;
            } else {
                caixaAlerta.style.display = "none";
            }

            let prodFinal = Math.max(5, producao + modProd);
            sustentabilidade = Math.min(100, Math.max(0, sustentabilidade + modSust));

            let multSust = Math.max(0.1, sustentabilidade / 100);
            let lucro = Math.floor(prodFinal * 12 * multSust);
            moedas += lucro;

            atualizarEras();
            atualizarInterface();
            verificarFimDeJogo();
        }

        function atualizarEras() {
            if (eraAtual === 1 && moedas >= 1500) {
                eraAtual = 2;
                document.getElementById('btn-soja').disabled = false;
                alert("🚜 ERA MECANIZADA! Cultura da Soja liberada no menu superior.");
            } else if (eraAtual === 2 && moedas >= 3000 && sustentabilidade >= 75) {
                eraAtual = 3;
                document.getElementById('btn-bio').disabled = false;
                alert("🛰️ ERA DIGITAL SUSTENTÁVEL! Alta tecnologia de Bioinsumos liberada. Produza em massa protegendo a natureza!");
            }
        }

        function verificarFimDeJogo() {
            if (sustentabilidade <= 0) {
                alert("🚨 FIM DE JOGO! A degradação ambiental extrema quebrou a fazenda.");
                reiniciarJogo();
            }
        }

        function reiniciarJogo() {
            moedas = 1000;
            producao = 0;
            sustentabilidade = 100;
            tamanhoMapaAtivo = 3;
            eraAtual = 1;
            construcaoSelecionada = null;
            document.getElementById('btn-soja').disabled = true;
            document.getElementById('btn-bio').disabled = true;
            document.getElementById('alerta-evento').style.display = "none";
            document.querySelectorAll('.btn-construcao').forEach(btn => btn.classList.remove('selecionado'));
            inicializarMapa();
            renderizarTabuleiro();
            atualizarInterface();
        }

        function atualizarInterface() {
            document.getElementById('txt-moedas').innerText = `R$ ${moedas}`;
            document.getElementById('txt-producao').innerText = `${producao} sc`;
            document.getElementById('txt-sustentabilidade').innerText = `${sustentabilidade}%`;
            document.getElementById('txt-tamanho').innerText = `${tamanhoMapaAtivo} x ${tamanhoMapaAtivo}`;

            const txtEra = document.getElementById('txt-era');
            if (eraAtual === 1) txtEra.innerText = "🌾 Tradicional";
            if (eraAtual === 2) txtEra.innerText = "🚜 Mecanizada";
            if (eraAtual === 3) txtEra.innerText = "🛰️ Sustentável";

            document.getElementById('txt-sustentabilidade').style.color = sustentabilidade <= 30 ? 'red' : 'var(--primary)';
        }

        inicializarMapa();
        renderizarTabuleiro();
    </script>
</body>
</html>
